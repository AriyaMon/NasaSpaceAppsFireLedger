name: Build and Publish FireLedger

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'assets/**'
      - '404.html'
      - '.nojekyll'
      - 'satellite-tles.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fireledger-compiled-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev code
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Test orbit calculations
        run: npx tsx --test src/lib/satelliteTracking.test.ts

      - name: Snapshot fresh orbital elements
        run: node scripts/fetchTleSnapshot.mjs

      - name: Build browser-ready site
        env:
          VITE_BASE_PATH: /APPS/
        run: npm run build

      - name: Verify compiled app
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -q 'src/main.tsx' dist/index.html; then
            echo 'Vite source entry is still in output' >&2
            exit 1
          fi

      - name: Publish prebuilt site into dev for branch-based Pages
        run: |
          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/index.html ./index.html
          cp dist/index.html ./404.html
          cp dist/satellite-tles.json ./satellite-tles.json
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html 404.html assets satellite-tles.json .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "build: publish compiled React app for GitHub Pages [skip ci]"
            git push origin HEAD:dev
          fi

      - name: Configure Actions-based Pages
        uses: actions/configure-pages@v5

      - name: Upload Vite output for Actions-based Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser-ready site when Pages uses Actions
        id: deployment
        uses: actions/deploy-pages@v4
