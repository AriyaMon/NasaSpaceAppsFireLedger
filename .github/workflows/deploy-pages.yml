name: Deploy FireLedger to GitHub Pages

on:
  push:
    branches:
      - dev
      - main
      - ryan_dev
      - dev_ui_draft
    paths-ignore:
      - 'assets/**'
      - 'pages-loader.js'
      - '404.html'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests
        run: npx tsx --test src/lib/*.test.ts

      - name: Build static observatory bundle & sync branch assets
        env:
          VITE_BASE_PATH: ./
        run: npm run build

      - name: Commit synced static bundle back to current branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets pages-loader.js 404.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "chore(pages): sync prebuilt static bundle for branch hosting [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Publish compiled bundle to gh-pages branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy compiled FireLedger static bundle (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
