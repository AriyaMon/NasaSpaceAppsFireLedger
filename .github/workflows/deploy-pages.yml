name: Build and Deploy FireLedger (Vite)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fireledger-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npx tsx --test src/lib/*.test.ts

      - name: Fetch CelesTrak TLE snapshot
        run: node scripts/fetchTleSnapshot.mjs

      - name: Build React/Vite site
        env:
          VITE_BASE_PATH: /APPS/
        run: npm run build

      - name: Validate compiled asset paths
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -q 'src/main.tsx' dist/index.html; then
            echo 'Error: uncompiled Vite HTML' >&2
            exit 1
          fi
          echo 'Compiled Vite assets verified'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
